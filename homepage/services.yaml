# Quant Research Control Center — read-only operational overview.
# Every live value comes from the single dashboard.json payload produced by candidate_snapshot.py.
# The browser links only to the existing Access-protected /detail view; the server-side widget URL
# remains loopback so Homepage never traverses Cloudflare Access to fetch its own data.

- 控制中心 · Control Center:
    - 系統健康:
        icon: mdi-heart-pulse
        href: https://quant.vicchong1983.trade/detail#health
        description: Watchdog 單一健康真值
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: health.status
              label: 狀態
              remap:
                - value: ok
                  to: 正常
            - field: health.active_count
              label: 警示
              format: number
            - field: health.last_check_at_utc
              label: 最後檢查
              format: relativeDate

    - 目前研究:
        icon: mdi-flask-outline
        href: https://quant.vicchong1983.trade/detail#current
        description: 當前策略研究進度
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: current.stage
              label: Stage
            - field: current.progress_text
              label: Progress
            - field: current.card_status
              label: Kanban
              remap:
                - value: running
                  to: 執行中
                - value: blocked
                  to: 需關注
                - value: done
                  to: 完成
            - field: current.last_activity_utc
              label: Activity
              format: relativeDate

    - Kanban:
        icon: mdi-view-kanban-outline
        href: https://quant.vicchong1983.trade/detail#agent
        description: Quant Strategy Research board
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: agent.running
              label: 執行中
              format: number
            - field: agent.blocked
              label: 已阻塞
              format: number
            - field: agent.board
              label: Board

    - 研究漏斗:
        icon: mdi-filter-variant
        href: https://quant.vicchong1983.trade/detail#funnel
        description: Review → Intake → Backtest
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: funnel.wiki_brain.summary
              label: Research Pool
            - field: funnel.backtested.summary
              label: Backtested

    - Leaderboard:
        icon: mdi-trophy-outline
        href: https://quant.vicchong1983.trade/detail#leaderboard
        description: Frozen survivor ranking
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: leaderboard.entries
            name: cohort
            label: summary
            limit: 2
            target: https://quant.vicchong1983.trade/detail#leaderboard

    - Runtime Evidence:
        icon: mdi-database-check-outline
        href: https://quant.vicchong1983.trade/detail#sources
        description: Authoritative evidence freshness
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: sources.results_root_readable
              label: Results
              remap:
                - value: true
                  to: Ready
            - field: sources.leaderboard_as_of_utc
              label: Leaderboard
              format: relativeDate
            - field: generated_at_utc
              label: Snapshot
              format: relativeDate

- 關注與近況 · Attention:
    - 需要關注:
        icon: mdi-alert-circle-outline
        href: https://quant.vicchong1983.trade/detail#current
        description: 只呈現現有卡片狀態，不自動修復
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: current.card_status
              label: Card status
              remap:
                - value: running
                  to: 執行中
                - value: blocked
                  to: 需關注
                - value: done
                  to: 完成
            - field: current.note
              label: Note
            - field: current.family_id
              label: Family
            - field: current.last_activity_utc
              label: Last activity
              format: relativeDate

    - 系統近況:
        icon: mdi-clock-outline
        href: https://quant.vicchong1983.trade/detail#metadata
        description: Snapshot / watchdog / board read-back
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: generated_at_utc
              label: Snapshot
              format: relativeDate
            - field: health.last_check_at_utc
              label: Watchdog
              format: relativeDate
            - field: agent.board_summary
              label: Kanban
            - field: leaderboard.as_of_utc
              label: Leaderboard
              format: relativeDate
