# Read-only quant observability cards. Every value comes from the single dashboard.json payload
# produced by runtime/candidate_snapshot.py (the same numbers as the Discord #candidate line), and the
# overall health is the quant watchdog's own state - nothing here re-checks the runtime.
# No card links to a control surface: there is no start/stop/retry button anywhere in this config.
#
# href/target are RELATIVE on purpose: /detail is the read-only page runtime/dashboard_serve.py
# renders from this very payload, so taps resolve against whichever origin the dashboard is opened
# from (localhost or the public hostname) instead of dying at http://127.0.0.1:8787 on a phone. The
# widget `url:` values stay 127.0.0.1 - Homepage fetches those server-side, so they still work
# remotely; only the browser-side links were broken.
#
# Serve the payload first:  python3 runtime/dashboard_serve.py --port 8787
- Quant Health:
    - Snapshot:
        href: /detail#health
        description: Read-only research progress, not live PnL
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: health.status
              label: Overall
            - field: health.summary
              label: Watchdog
            - field: health.last_check_at_utc
              label: Last check
              format: relativeDate
            - field: generated_at_utc
              label: Snapshot
              format: relativeDate

- Current Research:
    - Current:
        href: /detail#current
        description: Research progress — not live PnL
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: current.family_id
              label: Family
            - field: current.round_id
              label: Round
            - field: current.attempt
              label: Attempt
            - field: current.stage
              label: Stage
            - field: current.progress_text
              label: Progress
            - field: current.cohort
              label: Cohort
            - field: current.last_activity_utc
              label: Last activity
              format: relativeDate
            - field: current.card_status
              label: Kanban card

- Leaderboard:
    - Top 5:
        href: /detail#leaderboard
        description: Frozen survivor ranking (verbatim from leaderboard.json)
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: leaderboard.entries
            name: cohort
            label: summary
            target: /detail#leaderboard

- Research Funnel:
    - Funnel:
        href: /detail#funnel
        description: Reviewed → ingested → backtested
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: funnel.wiki_brain.share_pct
              label: Wiki Brain reviewed %
            - field: funnel.wiki_brain.summary
              label: Ingested
            - field: funnel.backtested.share_pct
              label: Families backtested %
            - field: funnel.backtested.summary
              label: Backtested

- Runtime & Agent:
    - Runtime health:
        href: /detail#health
        description: quant_runtime_watchdog state — the single health truth (W1-W4)
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: health.summary
              label: Watchdog
            - field: health.active_count
              label: Active findings
            - field: health.last_check_at_utc
              label: Last check
              format: relativeDate
            - field: health.last_healthy_at_utc
              label: Last healthy
              format: relativeDate
    - Agent:
        href: /detail#agent
        description: Kanban board read-back (read-only)
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: agent.board_summary
              label: Board
            - field: agent.board
              label: Board name
