# Quant Research Control Center — read-only operational overview.
# All live values come from the existing dashboard.json payload.

- 控制中心:
    - 系統健康:
        icon: mdi-heart-pulse
        href: https://quant.vicchong1983.trade/detail#health
        description: 系統健康檢查單一真值
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: health.status
              label: 狀態
              remap:
                - value: ok
                  to: 正常
            - field: health.active_count
              label: 警示數
              format: number
            - field: health.last_check_at_utc
              label: 最後檢查
              format: relativeDate

    - 目前研究:
        icon: mdi-flask-outline
        href: https://quant.vicchong1983.trade/detail#current
        description: 目前策略研究進度
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: current.stage
              label: 階段
              remap:
                - value: not launched
                  to: 尚未啟動
                - value: running
                  to: 執行中
                - value: running_qlib
                  to: 回測執行中
                - value: unknown
                  to: 未知
            - field: current.progress_text
              label: 進度
              remap:
                - value: unavailable (no round/attempt directory yet)
                  to: 尚無回測進度
            - field: current.card_status
              label: 任務狀態
              remap:
                - value: running
                  to: 執行中
                - value: blocked
                  to: 需關注
                - value: done
                  to: 完成
            - field: current.last_activity_utc
              label: 最近活動
              format: relativeDate

    - 任務看板:
        icon: mdi-view-kanban-outline
        href: https://quant.vicchong1983.trade/detail#agent
        description: 量化策略研究任務
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: agent.running
              label: 執行中
              format: number
            - field: agent.blocked
              label: 已阻塞
              format: number
            - field: agent.board
              label: 看板
              remap:
                - value: quant-strategy-research
                  to: 量化策略研究

    - 研究漏斗:
        icon: mdi-filter-variant
        href: https://quant.vicchong1983.trade/detail#funnel
        description: 累積實際運算量；下方為策略／家族研究漏斗
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: funnel.workload.evaluations
              label: 累積回測評估量
              format: number
            - field: funnel.wiki_brain.reviewed
              label: 已審閱策略
              format: number
            - field: funnel.wiki_brain.ingested
              label: 已納入策略
              format: number
            - field: funnel.backtested.registered
              label: 已登錄家族
              format: number
            - field: funnel.backtested.families
              label: 已完成回測家族
              format: number

    - 策略排行榜:
        icon: mdi-trophy-outline
        href: https://quant.vicchong1983.trade/detail#leaderboard
        description: 前五名策略；點入查看完整前十名
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: leaderboard.entries.0.cohort
              label: 第一名
              additionalField:
                field: leaderboard.entries.0.summary
            - field: leaderboard.entries.1.cohort
              label: 第二名
              additionalField:
                field: leaderboard.entries.1.summary
            - field: leaderboard.entries.2.cohort
              label: 第三名
              additionalField:
                field: leaderboard.entries.2.summary
            - field: leaderboard.entries.3.cohort
              label: 第四名
              additionalField:
                field: leaderboard.entries.3.summary
            - field: leaderboard.entries.4.cohort
              label: 第五名
              additionalField:
                field: leaderboard.entries.4.summary

    - 資料新鮮度:
        icon: mdi-database-check-outline
        href: https://quant.vicchong1983.trade/detail#sources
        description: 主要研究資料更新狀態
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: sources.results_root_readable
              label: 結果資料
              remap:
                - value: true
                  to: 可讀
            - field: sources.leaderboard_as_of_utc
              label: 排行榜資料
              format: relativeDate
            - field: generated_at_utc
              label: 系統快照
              format: relativeDate

- 關注與近況:
    - 需要關注:
        icon: mdi-alert-circle-outline
        href: https://quant.vicchong1983.trade/detail#current
        description: 只呈現目前異常，不自動修復
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: current.card_status
              label: 卡片狀態
              remap:
                - value: running
                  to: 執行中
                - value: blocked
                  to: 需關注
                - value: done
                  to: 完成
            - field: current.note
              label: 說明
              remap:
                - value: no round/attempt directory yet
                  to: 尚未建立回合／嘗試目錄
            - field: current.family_id
              label: 策略家族
            - field: current.last_activity_utc
              label: 最近活動
              format: relativeDate

    - 系統近況:
        icon: mdi-clock-outline
        href: https://quant.vicchong1983.trade/detail#metadata
        description: 系統快照與資料更新狀態
        widget:
          type: customapi
          url: http://127.0.0.1:8787/dashboard.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: generated_at_utc
              label: 系統快照
              format: relativeDate
            - field: health.last_check_at_utc
              label: 健康檢查
              format: relativeDate
            - field: agent.blocked
              label: 已阻塞任務
              format: number
            - field: leaderboard.as_of_utc
              label: 排行榜資料
              format: relativeDate
