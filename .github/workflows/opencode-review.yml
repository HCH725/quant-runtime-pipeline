name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review pull request with Muse Spark 1.3
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_PERMISSION: '{"edit": "deny", "bash": "deny"}'
        with:
          model: opencode-go/muse-spark-1.3-contributor
          use_github_token: true
          share: false
          prompt: |
            Review this pull request as an independent code reviewer. Do not modify files.
            Prioritize correctness, regressions, edge cases, failure paths, state or pipeline stalls,
            security, test gaps, configuration drift, and documentation/implementation mismatches.
            Prefer the smallest necessary fix and explicitly flag overengineering.
            Report actionable findings first with severity and file/line references.
            If there are no blocking findings, say so clearly and list any residual validation gaps.
